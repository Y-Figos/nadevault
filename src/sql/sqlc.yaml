version: 2

sql:
  - engine: postgresql
    schema: ../../infra/init/setup.sql
    queries: queries.sql
    gen:
      go:
        package: nadevault
        out: ../internal/db
        sql_package: pgx/v5
        overrides:
        - db_type: "nade_type"
          go_type: "string"
        - db_type: "side_type"
          go_type: "string"
        - db_type: "mouse_click"
          go_type: "string"